name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: npm install
      - name: 图片压缩（新增的 png/jpg 自动转 webp）
        run: |
          python3 -m pip install --quiet --upgrade pillow
          python3 scripts/opt-img.py --inplace
          # 转完删掉原图：一来避免 png/jpg 被打进 dist，二来上传体积更小
          find src/assets -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -delete
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./dist
          force_orphan: true